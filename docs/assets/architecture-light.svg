<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
<title id="t">Where mandate-ledger sits</title>
<desc id="d">A wallet signs a mandate and an AI agent builds a cart. Both enter mandate-ledger, which checks signature, scope, budget, revocation, payee and nonce, then moves the payment through authorized, paid, settled and delivered. Every decision, refusals included, is appended to a hash chain verifiable offline. Proof goes down to the rail, which moves the money, and finality comes back; the merchant delivers only on settled. Any disagreement is refused with a stable code and recorded.</desc>
