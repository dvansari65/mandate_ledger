<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" role="img" aria-labelledby="t d">
<title id="t">How an AI agent pays with x402 through mandate-ledger</title>
<desc id="d">A sequence diagram. The agent requests a resource and gets a 402 with the price. It asks mandate-ledger to authorize the cart under its mandate, gets a context id, signs an EIP-3009 authorization whose nonce is bound to that context, and records the payment, which the ledger verifies. It retries with the payment; the merchant has the facilitator settle it on Base. The merchant records the settlement, which the ledger calls final after enough confirmations, records delivery, and returns the resource.</desc>
