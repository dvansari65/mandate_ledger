[workspace]
resolver = "2"
members = [
    "crates/ml-core",
    "crates/ml-adapters",
    "crates/ml-store-postgres",
    "crates/ml-verify",
    "crates/ml-sandbox",
    "examples/quickstart",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
ml-core = { path = "crates/ml-core", version = "0.0.1" }
ml-adapters = { path = "crates/ml-adapters", version = "0.0.1" }
ml-store-postgres = { path = "crates/ml-store-postgres", version = "0.0.1" }

postgres = { version = "0.19", features = ["with-serde_json-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.11"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.23"
ed25519-dalek = "3"
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
