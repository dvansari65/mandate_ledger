[workspace]
resolver = "2"
members = [
    "crates/ml-core",
    "crates/ml-adapters",
    "crates/ml-store-postgres",
    "crates/ml-verify",
    "crates/ml-sandbox",
    "crates/ml-serve",
    "examples/quickstart",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/dvansari65/mandate_ledger"
homepage = "https://mandate-ledger.vercel.app"
readme = "README.md"

[workspace.dependencies]
ml-core = { path = "crates/ml-core", version = "0.0.1" }
ml-adapters = { path = "crates/ml-adapters", version = "0.0.1" }
ml-store-postgres = { path = "crates/ml-store-postgres", version = "0.0.1" }

postgres = { version = "0.19", features = ["with-serde_json-1"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.11"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.23"
ed25519-dalek = "3"
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"

# The service's HTTP stack. utoipa stays on 5: 6 needs Rust 1.88.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["catch-panic", "set-header"] }
http = "1"
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
subtle = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
